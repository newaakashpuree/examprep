<script>
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const net=(N,E,C,W,H)=>`<svg viewBox="0 0 ${W} ${H}" class="svg"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs>`+E.map(([a,b,l])=>{const[x1,y1]=N[a],[x2,y2]=N[b],c=C.includes(a+'-'+b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;return`<line x1="${x1+ux*18}" y1="${y1+uy*18}" x2="${x2-ux*20}" y2="${y2-uy*20}" stroke="${c?'#ef4444':'currentColor'}" stroke-width="${c?4:1.6}" marker-end="url(#ar)"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle" class="lb">${l||''}</text>`}).join('')+Object.entries(N).map(([k,[x,y]])=>`<circle cx="${x}" cy="${y}" r="18" class="nd"/><text x="${x}" y="${y+5}" text-anchor="middle" class="nt">${k}</text>`).join('')+`</svg>`;
const UN=["Introduction to Software Engineering","Project Management Techniques","Software Development Phases (3.1–3.3)"];
const T=[
{id:"1.1",u:0,t:"Software Engineering Definition",def:"Software engineering means building software in a planned, engineering way — study the needs, design, develop, test and maintain — so it comes out good, on time and within budget.",
n:["It is a detailed study of engineering applied to analyzing user requirements, design, development, maintenance and testing of software.","It was introduced to fix low-quality projects: software that crosses timelines, budgets and quality limits.","It ensures the application is built consistently, correctly, on time, on budget and within requirements.","Demand also grew because user requirements and the working environment change very fast."],
tb:tbl(["Who","Definition (simple)"],[["IEEE 610.12-1990","Systematic, disciplined, computable approach to development, operation and maintenance of software"],["Fritz Bauer","Use of standard engineering principles to get software that is reliable and works efficiently on real machines, economically"],["Boehm","Practical application of scientific knowledge to creative design and building of programs, plus the documentation needed to develop, operate and maintain them"]]),
an:"Building a house: a good engineer first makes a plan, then foundation, walls, wiring and inspection. Without it the house cracks, costs more and finishes late. Software is the same.",
ex:"A payment app like eSewa is built with planned steps — requirements, design, coding, testing — so transfers don't fail. A rushed app with no plan would crash in the Dashain shopping rush.",
mn:"<b>ADDMT</b> = <b>A</b>ll <b>D</b>ogs <b>D</b>on't <b>M</b>ind <b>T</b>reats → Analyze, Design, Develop, Maintain, Test.<br>Who said what: <b>IEEE = Systematic</b>, <b>Bauer = Basic principles</b>, <b>Boehm = Brain (science) + documents</b>.",
q:["Define software engineering and explain the definitions by IEEE, Fritz Bauer and Boehm. (5 marks)","<ul><li>SE is the engineering approach to analyzing requirements, design, development, maintenance and testing of software.</li><li>Introduced to solve low quality, delays and over-budget projects.</li><li>IEEE 610.12-1990: systematic, disciplined, computable approach for development, operation, maintenance.</li><li>Fritz Bauer: standard engineering principles to get reliable, efficient software economically.</li><li>Boehm: practical use of scientific knowledge to design/build programs, with documentation.</li></ul>"],
m:[["Software engineering was introduced mainly to solve:","Slow internet|Low-quality projects that cross time and budget|Hardware shortage|Lack of programmers",1,"It was introduced for low-quality projects exceeding timelines and budgets."],["“Systematic, disciplined, computable approach” is the definition by:","IEEE 610.12-1990|Boehm|Fritz Bauer|Charles Babbage",0,"That wording is the IEEE standard 610.12-1990."],["Fritz Bauer says SE gives software that is:","Colourful and free|Reliable and efficient on real machines|Very short|Only hardware based",1,"Bauer: standard engineering principles → reliable, efficient software."],["Boehm's definition also includes:","Only coding|Only testing|Documentation for developing, operating and maintaining|Only hardware",2,"Boehm adds the associated documentation."]]},
{id:"1.2",u:0,t:"Importance of Software Engineering",def:"Importance = why we need SE: it makes software cheaper, faster, less complex, reliable and effective, even for big projects.",
n:["<b>Reduces complexity:</b> big project is split into small parts; each team works independently, so errors are fewer.","<b>Reduces cost:</b> a planned approach removes unnecessary processes, so costly experts spend less effort.","<b>Reduces time:</b> a perfect production plan avoids repeated write-and-run waste.","<b>Handles big projects:</b> projects of 6–7 months need planning, monthly progress checks, testing and maintenance.","<b>Reliable software:</b> works for the guaranteed period; company fixes bugs; testing and maintenance exist.","<b>Effectiveness:</b> software follows the company's standards, so it performs well."],
tb:tbl(["Point","Key idea"],[["Complexity","Divide into parts"],["Cost","Remove useless steps"],["Time","Follow a plan"],["Big projects","Management + monthly tracking"],["Reliable","Testing + maintenance"],["Effective","Follow standards"]]),
an:"A wedding in a big hall: one person can't do everything. Split work (food, decoration, music), follow a schedule and checklist — less stress, less cost, on time.",
ex:"A telecom app (NTC/Ncell style) has recharge, data pack, login and offers. Separate teams build each part, then combine — easier, cheaper and with fewer bugs.",
mn:"<b>C-C-T-B-R-E</b> = <b>C</b>ute <b>C</b>ats <b>T</b>ake <b>B</b>ig <b>R</b>ests <b>E</b>veryday → Complexity, Cost, Time, Big projects, Reliable, Effective.",
q:["Explain the importance of software engineering. (5 marks)","<ul><li>Reduces complexity by dividing the project into independent parts.</li><li>Reduces cost through a planned approach.</li><li>Reduces time with a proper production plan.</li><li>Handles big projects using planning, tracking, testing and maintenance.</li><li>Gives reliable software (bugs fixed, tested, maintained).</li><li>Makes software effective by following standards.</li></ul>"],
m:[["Dividing a big project into smaller parts mainly helps to:","Reduce complexity|Add more bugs|Skip testing|Raise salary",0,"Small parts, handled by separate teams, make the project simpler."],["A planned approach that removes unnecessary processes mainly:","Raises cost|Reduces cost|Removes the client|Stops testing",1,"Less unnecessary work = lower production cost."],["Company fixing bugs during the guaranteed period shows:","Reliability|Complexity|Speed|Hardware",0,"Reliable software: testing and maintenance give trust."],["Software becomes more effective when it follows:","Random choices|Company standards|Only the programmer's wish|No rules",1,"Standards are part of SE and improve effectiveness."]]},
{id:"1.3",u:0,t:"Applications of Software Engineering",def:"Applications = the kinds of software SE is used to build. The type of application decides which SE methods fit best.",
n:["<b>System software:</b> platform for other software; interface between hardware and applications (device drivers, operating system, language processor).","<b>Application / stand-alone:</b> needs nothing else to run (Notepad, Calculator, MS Word, Photoshop).","<b>Scientific / engineering:</b> understand or predict real-world processes (weather forecast, volcanology; nuclear, medicine, military).","<b>Product line:</b> many similar systems from shared assets (MS Office for Mac, home, small business, enterprise).","<b>Embedded:</b> inside non-PC hardware with memory limits (GPS, factory robots, smart watch, microwave, washing machine).","<b>Web application:</b> built with HTML/CSS/JS, used in a browser (Amazon, Gmail, Wikipedia, Facebook).","<b>Artificial intelligence:</b> learning, reasoning, problem-solving (expert systems, NLP, speech recognition)."],
tb:tbl(["Type","Runs on / uses","Example"],[["System","Hardware ↔ apps","Operating system"],["Stand-alone","Alone, no internet","Calculator"],["Scientific","Predicts real world","Weather forecast"],["Product line","Shared parts, many versions","MS Office"],["Embedded","Special device","Washing machine"],["Web","Browser","Gmail"],["AI","Learns, reasons","Speech recognition"]]),
an:"Vehicles: bus, bike, tractor, plane — each built for a different job. Likewise each software type needs a different building method.",
ex:"Android (system) runs your phone; Calculator is stand-alone; the DHM weather forecast is scientific; a rice-cooker chip is embedded; Daraz is a web app; voice search is AI.",
mn:"<b>S-A-S-P-E-W-A</b> = <b>S</b>mart <b>A</b>nts <b>S</b>hare <b>P</b>izza <b>E</b>very <b>W</b>eekend <b>A</b>gain → System, Application, Scientific, Product line, Embedded, Web, AI.",
q:["Explain any five applications of software engineering with examples. (5 marks)","<ul><li>System software – OS, drivers; platform for other software.</li><li>Stand-alone – Notepad, Word; works alone.</li><li>Scientific – weather forecast; predicts real-world processes.</li><li>Embedded – smart watch, washing machine; limited memory.</li><li>Web application – Gmail, Amazon; runs in a browser.</li></ul>"],
m:[["Expert systems, NLP and speech recognition are applications of:","System software|Embedded software|Artificial intelligence software|Product line software",2,"These simulate human intelligence → AI software."],["MS Office with versions for home, small business and enterprise is:","Product line software|Embedded software|Scientific software|Device driver",0,"Similar systems from shared assets = product line."],["Software inside a smart watch or washing machine is:","Web application|Embedded software|Stand-alone software|Language processor",1,"Embedded software is written for specific hardware."],["Software built with HTML, CSS, JS and used in a browser is:","Embedded|Web application|Operating system|Scientific",1,"Gmail, Amazon, Facebook are web applications."]]},
{id:"2.1",u:1,t:"Introduction to Project Development Techniques",def:"Project management techniques are strategies that help a team work smoothly and succeed — less waste, more profit, happier customers.",
n:["They make planning and managing projects easier and more effective.","They can be applied to any project in any field or industry.","With project management software they save time and reduce cost.","Managers use them to organize, schedule and manage teams in every phase: <b>Initiation, Planning, Execution, Conclusion</b>."],
tb:tbl(["Phase","Meaning"],[["1 Initiation","Project is started"],["2 Planning","Plan tasks and time"],["3 Execution","Work is carried out"],["4 Conclusion","Project is finished"]]),
an:"A cricket captain uses a strategy for each over — field setting, bowling order, batting order. The techniques are the captain's strategy for the whole match.",
ex:"A school annual function in Kathmandu: decide to hold it (initiation), plan programs and budget, run the event, then close and review accounts.",
mn:"<b>IPEC</b> = <b>I</b> <b>P</b>lan <b>E</b>very <b>C</b>lass → Initiation, Planning, Execution, Conclusion.",
q:["What are project management techniques? Name their phases. (5 marks)","<ul><li>Strategies that help a team optimize workflow and ensure success.</li><li>Goals: less waste, more profit, better customer satisfaction.</li><li>Applicable to any project in any industry.</li><li>Phases: Initiation, Planning, Execution, Conclusion.</li><li>Examples: PERT and CPM.</li></ul>"],
m:[["Correct order of phases is:","Planning, Initiation, Execution, Conclusion|Initiation, Planning, Execution, Conclusion|Execution, Planning, Initiation, Conclusion|Conclusion, Planning, Execution, Initiation",1,"Initiation → Planning → Execution → Conclusion."],["Project management techniques are:","Strategies that optimize a team's workflow|Only programming languages|Only hardware|Only testing tools",0,"They are strategies for workflow and success."],["Techniques can be applied to:","Only software|Only construction|Any project in any industry|Only banks",2,"They work regardless of field or industry."],["Which is NOT a phase of a project?","Initiation|Planning|Execution|Marketing",3,"Marketing is not in the four listed phases."]]},
{id:"2.2",u:1,t:"PERT – Introduction and Implementation",def:"PERT (Program Evaluation Review Technique) is a planning tool that draws a project's timeline as a network and calculates realistic completion time using three time estimates.",
n:["Created in the 1950s for US Navy weapons and defense projects. Similar to critical path method. Calculated backward from a fixed end date.","Three estimates per task: <b>optimistic (to)</b> shortest, <b>most likely (tm)</b>, <b>pessimistic (tp)</b> longest.","<b>Event</b> = node where an activity starts/ends. <b>Activity</b> = task, time in brackets. <b>Critical path</b> = longest chain of essential activities from first to last event.","<b>Advantages:</b> maximizes resource use; easier planning; works with little or no past data; gives a better completion date.","<b>Disadvantages:</b> hard to read in complex projects (Gantt chart is used); tedious to update; time estimates are subjective."],
tb:`<p><b>PERT network</b> (file example; red = critical path 1-2-3-5-8, numbers = expected time):</p>`+net({1:[30,130],2:[140,70],6:[140,200],3:[270,25],4:[270,105],5:[390,70],7:[290,200],8:[510,130]},[[1,2,7],[1,6,6],[2,3,14],[2,4,5],[3,5,11],[4,5,7],[6,7,11],[5,8,4],[7,8,18]],['1-2','2-3','3-5','5-8'],560,235)+tbl(["Activity","to","tm","tp","Te","σ²"],[["1-2",1,7,13,7,4],["1-6",2,5,14,6,4],["2-3",2,14,26,14,16],["2-4",2,5,8,5,1],["3-5",7,10,19,11,4],["4-5",5,5,17,7,4],["6-7",5,8,29,11,16],["5-8",3,3,9,4,1],["7-8",8,17,32,18,16]]),
an:"Planning a trip from Kathmandu to Pokhara: best case 5 h (no traffic), normal 7 h, worst 12 h (landslide). You don't promise 5 h — you use a weighted average. That's PERT.",
ex:"Estimating when a new Nepali government-office website will go live: developers give best, normal and worst times for each task; PERT combines them into a realistic date.",
mn:"<b>“Only 4 Momos Please, ÷ 6 friends”</b> → Te = (O + 4M + P) / 6.<br><b>“Pessimist minus Optimist, share by 6, then Square”</b> → σ² = ((P−O)/6)².<br>Project: add variances on the critical path → √ = σ → <b>Z = (Ts − Te)/σ</b>.",
x:`<h2>🎯 PERT Lab – learn it step by step</h2><div class="card"><ol><li><b>Draw the network</b> (events = circles, activities = arrows).</li><li>For each activity find <b>Te</b> and <b>variance</b>.</li><li>Find earliest and latest event times (forward and backward pass).</li><li>Critical path = longest path. <b>Expected project length = sum of its Te</b>.</li><li>Project variance = sum of σ² on the critical path; σ = √variance.</li><li>Find <b>Z = (Ts − Te)/σ</b>, then read probability P(Z ≤ D) from the normal table.</li></ol></div><div class="card"><b>Worked (file example):</b> critical path 1-2-3-5-8 = 7+14+11+4 = <b>36</b>. Variance = 4+16+4+1 = <b>25</b>, σ = <b>5</b>. D = (40−36)/5 = <b>0.8</b>, P(Z≤0.8) = 0.7881 → <b>78.81%</b> chance to finish in 40.</div><div class="card"><b>🧮 Try it – activity:</b> O <input id="po" type="number" value="1"> M <input id="pm" type="number" value="7"> P <input id="pp" type="number" value="13"> <button class="pb" onclick="pc()">Calc</button><br><b id="pr"></b><hr><b>Probability:</b> Ts <input id="ps" type="number" value="40"> Te <input id="pe" type="number" value="36"> σ <input id="pg" type="number" value="5"> <button class="pb" onclick="pz()">Calc</button><br><b id="pq"></b></div>`,
q:["Explain PERT with its advantages and disadvantages. (5 marks) / Solve a PERT numerical (10 marks)","<ul><li>PERT: tool showing a project timeline graphically and estimating realistic completion time.</li><li>Uses three times: optimistic, most likely, pessimistic. Te = (to+4tm+tp)/6; σ² = ((tp−to)/6)².</li><li>Adv: better resource use, easy planning, works without past data, better completion date.</li><li>Disadv: hard for complex projects, tedious to update, subjective estimates.</li><li>10 marks: draw network → Te and σ² → critical path → length → σ → Z → probability.</li></ul>"],
m:[["PERT was created in the 1950s for the:","US Navy|Nepal Army|Banks|Schools",0,"PERT was made for US Navy weapons/defense projects."],["Activity with to=1, tm=7, tp=13 has Te =","6|7|8|9",1,"(1 + 4×7 + 13)/6 = 42/6 = 7."],["Variance of an activity with to=2, tp=26 is:","4|9|16|24",2,"((26−2)/6)² = 4² = 16."],["Critical path length 36, Ts = 40, σ = 5. Z =","0.4|0.8|1.0|8",1,"(40 − 36)/5 = 0.8 → 78.81%."]]},
{id:"2.3",u:1,t:"CPM – Introduction and Implementation",def:"CPM (Critical Path Method) finds the tasks that must finish on time and how much flexibility (slack) the other tasks have. The critical path is the longest chain of dependent activities.",
n:["Developed in the late 1950s to solve cost problems from inefficient scheduling.","Needs: list of all tasks, dependencies between tasks, duration of each.","Delay in any critical task delays the whole project.","<b>Why use:</b> improves future planning, better resource management, avoids bottlenecks.","<b>Forward pass</b> gives ES, EF: EF = ES + D (several predecessors → take the <b>largest</b>).","<b>Backward pass</b> gives LF, LS: LS = LF − D (several successors → take the <b>smallest</b>). Slack SL = LS − ES = LF − EF.","<b>Critical path</b> = all slack zero; project time = sum of critical durations.","<b>Total float</b> = LS − ES (or LF − EF). <b>Free float</b> = delay possible without affecting the next activity (= EF − ES − D as per notes; where activities converge, use the largest EF)."],
tb:`<p><b>CPM network</b> (letters = activities; red = critical A-B-D-F):</p>`+net({A:[40,100],B:[160,40],C:[160,160],D:[290,40],E:[290,160],F:[420,100]},[['A','B'],['A','C'],['B','D'],['C','E'],['D','F'],['E','F']],['A-B','B-D','D-F'],480,200)+tbl(["Act","Pred","D","ES","EF","LS","LF","SL"],[["A","–",5,0,5,0,5,0],["B","A",4,5,9,5,9,0],["C","A",5,5,10,7,12,2],["D","B",6,9,15,9,15,0],["E","C",3,10,13,12,15,2],["F","D,E",4,15,19,15,19,0]])+`<p>Critical path A→B→D→F = 5+4+6+4 = <b>19 months</b>. Second example: critical path 1-3-5-7-8-10 = <b>22 days</b>.</p>`,
an:"Cooking dal-bhat: rice (long) is the critical task; chopping pickle has slack. If the pickle is late by 5 minutes, dinner is fine; if the rice is late, dinner is late.",
ex:"Constructing a house in Pokhara: foundation → walls → roof is critical; painting the fence has float. A delay in the roof delays the housewarming.",
mn:"<b>Forward = Fat (largest), Backward = Brief (smallest).</b> <b>Zero Slack = Zone of No Sleep</b> (critical). Formula chant: <b>EF = ES + D, LS = LF − D, Slack = LF − EF</b>.",
q:["Explain CPM and calculate the critical path (10 marks)","<ul><li>CPM identifies critical tasks, dependencies and durations; critical path = longest dependent chain.</li><li>Build network from activity, predecessor, duration table.</li><li>Forward pass: ES, EF = ES + D (largest). Backward pass: LF, LS = LF − D (smallest).</li><li>Slack = LS − ES; slack 0 ⇒ critical.</li><li>Example: A-B-D-F, 5+4+6+4 = 19 months.</li><li>Total float = LS − ES; free float = delay without affecting next activity.</li></ul>"],
m:[["The critical path is:","Shortest chain of tasks|Longest chain of dependent activities|Any random path|Path with the most slack",1,"Critical path = longest sequence that must finish on time."],["Slack of a critical activity is:","0|1|2|Infinity",0,"Critical tasks have zero float."],["In forward pass with many predecessors choose the:","Smallest EF|Largest EF|Average|Any",1,"Forward pass → largest; backward pass → smallest."],["Activities A(5), B(4), D(6), F(4) are critical. Project duration =","15|17|19|21",2,"5+4+6+4 = 19 months."]]},
{id:"2.4",u:1,t:"Implementation of Project Management Techniques in Real World",def:"This topic means applying PERT on a real-style problem: construct network, find Te and variance, critical path, project time and probability.",
n:["Given: activities with predecessors and (to, tm, tp) in weeks.","Compute Te = (to+4tm+tp)/6 and σ² = ((tp−to)/6)² for each activity.","List all paths from start to end; the longest is critical.","Variance of project = sum of σ² on critical path; σ = √.","Probability for 22 weeks: Z = (22 − Te)/σ."],
tb:tbl(["Act","Pred","Te","σ²"],[["A","–",6,"0.11"],["B","–",3,"0.44"],["C","–",4,"1"],["D","A",2,"0.11"],["E","B",3,"1.78"],["F","C",5,"1.78"],["G","C",3,"1"],["H","E,F",5,"1"],["I","D",5,"1"],["J","H,G",3,"1"]])+tbl(["Path","Length"],[["A-D-I","13"],["B-E-H-J","14"],["<b>C-F-H-J</b>","<b>17 (critical)</b>"],["C-G-J","10"]])+`<p>Variance = 1+1.78+1+1 = 4.78, σ ≈ 2.19. Z = (22−17)/2.19 ≈ 2.29 → P ≈ <b>0.989 (≈ 98.9%)</b>.</p>`,
an:"Like a bus company checking all routes from Kathmandu to Janakpur and trusting the slowest route to decide the arrival time.",

const mq=t=>t.m.map(m=>({q:m[0],o:m[1].split('|'),a:m[2],e:m[3],t:t.id}));
let dn={},op={0:1},cur='t1.1',tm=null;try{dn=JSON.parse(localStorage.getItem('se_dn')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('se_dn',JSON.stringify(dn))}catch(e){}};
const O=[];UN.forEach((_,i)=>{T.filter(t=>t.u==i).forEach(t=>O.push('t'+t.id));O.push('u'+i)});O.push('master','diff','final');
const th=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#fff';r.dataset.theme=d?'dark':'light'};
function nav(){const ex=[['master','📄 Master Revision Sheet'],['diff','⚖️ Difference Tables'],['final','🏁 Final Exam']];
$('#nav').innerHTML=`<div class="sj">📘 Software Engineering</div>`+UN.map((n,i)=>`<div class="un" onclick="op[${i}]=!op[${i}];nav()">${op[i]?'▾':'▸'} Unit ${i+1}: ${n}</div>`+(op[i]?T.filter(t=>t.u==i).map(t=>`<a class="tp ${cur=='t'+t.id?'on':''}" onclick="go('t${t.id}')">${dn[t.id]?'✅':'⭕'} ${t.id} ${t.t}</a>`).join('')+`<a class="tp ${cur=='u'+i?'on':''}" onclick="go('u${i}')">📝 Unit ${i+1} Test</a>`:'')).join('')+ex.map(e=>`<div class="un ${cur==e[0]?'on':''}" onclick="go('${e[0]}')">${e[1]}</div>`).join('');
const p=Math.round(Object.keys(dn).filter(k=>dn[k]).length/T.length*100);$('#pb i').style.width=p+'%';$('#pt').textContent=p+'%'}
function go(id){clearInterval(tm);cur=id;if(id[0]=='t')op[T.find(t=>'t'+t.id==id).u]=1;if(id[0]=='u')op[+id[1]]=1;const m=$('#mn');m.innerHTML='';
 if(id[0]=='t')topic(m,T.find(t=>'t'+t.id==id));else if(id[0]=='u')unit(m,+id[1]);else if(id=='master')master(m);else if(id=='diff')diff(m);else final(m);
 const i=O.indexOf(id);m.insertAdjacentHTML('beforeend',`<div class="nv"><button ${i?'':'disabled'} onclick="go('${O[i-1]}')">← Previous</button><button ${i<O.length-1?'':'disabled'} onclick="go('${O[i+1]}')">Next →</button></div>`);
 nav();$('#nav').classList.remove('o');scrollTo(0,0)}
function quiz(el,qs,fin){let r=[],n=0,d=0;const fn=()=>{if(d)return;d=1;fin(qs.filter((q,i)=>r[i]===q.a).length,r)};
 qs.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<p><b>${i+1}.</b> ${q.q}</p>`+q.o.map(o=>`<button>${o}</button>`).join('')+`<p class="fb"></p>`;
 d.onclick=e=>{const b=e.target.closest('button');if(!b||r[i]!==undefined)return;const bs=[...d.querySelectorAll('button')],j=bs.indexOf(b);r[i]=j;bs[q.a].classList.add('ok');if(j!=q.a)b.classList.add('no');d.querySelector('.fb').innerHTML=(j==q.a?'✅ Correct! ':'❌ Not quite. ')+q.e;if(++n==qs.length)fn()};el.appendChild(d)});return fn}
const grade=p=>p>=90?'🏆 A+ level!':p>=75?'👍 Good — revise weak topics':'📚 Keep revising';
function topic(m,t){const L=t.n.map(x=>`<li>${x}</li>`).join('');
 m.innerHTML=`<p style="color:var(--mut)">Unit ${t.u+1} · Topic ${t.id}</p><h1>${t.t}</h1><h2>1. Definition (simple words)</h2><div class="card">${t.def}</div><h2>Detailed notes</h2><ul>${L}</ul><h2>2. Real-life analogy 💡</h2><div class="card">${t.an}</div><h2>3. Daily-life example 🇳🇵</h2><div class="card">${t.ex}</div><h2>4. Diagram / Table</h2>${t.tb}${t.x||''}<h2>5. Memory trick 🧠</h2><div class="card mn">${t.mn}</div><h2>6. Likely exam question 📝</h2><div class="card"><b>Q. ${t.q[0]}</b>${t.q[1]}</div><h2>7. Quiz – 4 MCQs</h2><div id="qz"></div><div id="qr"></div><button class="pb" onclick="dn['${t.id}']=!dn['${t.id}'];sv();nav();this.textContent=dn['${t.id}']?'✅ Marked done':'Mark as done'">${dn[t.id]?'✅ Marked done':'Mark as done'}</button>`;
 quiz($('#qz'),mq(t),sc=>{$('#qr').innerHTML=`<p class="big">${sc}/4</p>`;dn[t.id]=true;sv();nav()})}
function pc(){const o=+po.value,mm=+pm.value,p=+pp.value;pr.textContent=`Te = ${((o+4*mm+p)/6).toFixed(2)}, Variance = ${(((p-o)/6)**2).toFixed(2)}`}
const phi=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
function pz(){const D=(+ps.value-+pe.value)/+pg.value;pq.textContent=`D = ${D.toFixed(2)}, P = ${(phi(D)*100).toFixed(2)}%`}
function res(el,sc,n,qs,r){const p=Math.round(sc/n*100),w=[...new Set(qs.filter((q,i)=>r[i]!==q.a).map(q=>q.t))];
 el.innerHTML=`<div class="card"><p class="big">${sc}/${n} (${p}%)</p>${grade(p)}<p>${w.length?'Weak topics: '+w.map(x=>`<a href="#" onclick="go('t${x}');return false">${x}</a>`).join(', '):'No weak topics 🎉'}</p></div>`+(el.id=='fr'?qs.map((q,i)=>`<div class="card"><b>${i+1}. ${q.q}</b><br>Your answer: ${r[i]==null?'—':q.o[r[i]]} ${r[i]==q.a?'✅':'❌'}<br>Correct: ${q.o[q.a]}<br><i>${q.e}</i></div>`).join(''):'')}
function unit(m,u){const qs=sh(T.filter(t=>t.u==u).flatMap(mq)).slice(0,10);m.innerHTML=`<h1>📝 Unit ${u+1} Test</h1><p>${qs.length} mixed MCQs from all topics of this unit.</p><div id="uq"></div><div id="ur"></div>`;
 quiz($('#uq'),qs,(sc,r)=>{$('#ur').id='fr0';res($('#fr0'),sc,qs.length,qs,r)})}
function final(m){m.innerHTML=`<h1>🏁 Final Exam</h1><p>30 shuffled MCQs from all units · 30 minutes.</p><button class="pb" onclick="fs()">Start exam</button><div id="fx"></div>`}
function fs(){const qs=sh(T.flatMap(mq)).slice(0,30);let s=1800;$('#fx').innerHTML=`<h2 id="tmr" style="position:sticky;top:60px;background:var(--bg)">⏱ 30:00</h2><div id="fq"></div><div id="fr"></div>`;
 const f=quiz($('#fq'),qs,(sc,r)=>{clearInterval(tm);res($('#fr'),sc,qs.length,qs,r)});
 tm=setInterval(()=>{s--;tmr.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s<=0){clearInterval(tm);f()}},1000)}
function master(m){m.innerHTML=`<h1>📄 Master Revision Sheet</h1><h2>Key definitions</h2>`+T.map(t=>`<div class="card"><b>${t.id} ${t.t}</b><br>${t.def}<br><small>🧠 ${t.mn}</small></div>`).join('')+`<h2>Formulas</h2><div class="card">Te = (to + 4tm + tp)/6<br>σ² = ((tp − to)/6)²<br>Project σ = √(sum of σ² on critical path)<br>Z = (Ts − Te)/σ<br>EF = ES + D · LS = LF − D · Slack = LS − ES = LF − EF<br>Total float = LS − ES · Forward pass = largest, Backward pass = smallest</div><h2>Worked answers</h2><div class="card">PERT example: path 1-2-3-5-8 = 36, σ² = 25, σ = 5, D = 0.8, P = 78.81%<br>CPM example 1: A-B-D-F = 19 months · Example 2: 1-3-5-7-8-10 = 22 days<br>Real-world PERT: C-F-H-J = 17 weeks, σ ≈ 2.19, P(≤22) ≈ 98.9%</div><h2>Key lists</h2><div class="card">Phases: Initiation, Planning, Execution, Conclusion<br>Feasibility: Economic, Operational, Organizational, Technical, Schedule<br>Applications: System, Stand-alone, Scientific, Product line, Embedded, Web, AI</div>`}
function diff(m){m.innerHTML=`<h1>⚖️ Difference Tables</h1><h2>PERT vs CPM</h2>`+tbl(["Point","PERT","CPM"],[["Time estimates","Three: optimistic, most likely, pessimistic","Single duration per activity"],["Origin","1950s, US Navy weapons/defense","Late 1950s, to cut cost of inefficient scheduling"],["Calculated","Backward from a fixed end date","Forward and backward pass (ES, EF, LS, LF)"],["Focus","Realistic completion time and probability","Critical tasks, dependencies and float"]])+`<h2>Total float vs Free float</h2>`+tbl(["Point","Total float","Free float"],[["Meaning","Delay allowed without delaying project end","Delay allowed without affecting the next activity"],["Formula","LS − ES or LF − EF","EF − ES − D (largest EF at common successor)"]])+`<h2>Critical vs Non-critical activity</h2>`+tbl(["Point","Critical","Non-critical"],[["Float","Zero","Positive"],["Delay","Delays whole project","Can be delayed"],["Path","Longest path","Shorter paths"]])+`<h2>Forward pass vs Backward pass</h2>`+tbl(["Point","Forward","Backward"],[["Finds","ES, EF","LS, LF, slack"],["Rule","Largest value","Smallest value"]])+`<h2>Types of feasibility</h2>`+tbl(["Type","Checks"],[["Economic","Budget"],["Operational","User's environment"],["Organizational","Company policy"],["Technical","Present system and resources"],["Schedule","Time frame"]])+`<h2>Software application types</h2>`+tbl(["Type","Example"],[["System","OS, drivers"],["Stand-alone","Notepad, Calculator"],["Embedded","Smart watch, microwave"],["Web","Gmail, Amazon"],["Scientific","Weather forecast"],["Product line","MS Office editions"],["AI","Speech recognition"]])}
